[package]
name = "aura-reed-rust"
version = "2.5.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
baileys-rs = { path = "../Baileys-Rust" }
base64 = "0.22"
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "process", "signal"] }

[profile.release]
opt-level = 3
lto = false
incremental = true
codegen-units = 8
debug = false
strip = true
